[package]
name = "yuki"
version = "0.3.4"
description = "Yuki - a fast, focused desktop front-end for yt-dlp"
authors = ["Yuki"]
edition = "2021"
license = "Unlicense"

[lib]
name = "yuki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
xz2 = "0.1"
tauri = { version = "~2.12.4", features = [] }
tauri-plugin-dialog = "~2.7.1"
tauri-plugin-opener = "2"
thiserror = "2"
ureq = { version = "2", features = ["json", "tls", "socks-proxy"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
