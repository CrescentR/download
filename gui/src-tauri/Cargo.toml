[package]
name = "ytdlp-studio"
version = "0.1.0"
description = "A native desktop shell for yt-dlp"
authors = ["yt-dlp Studio"]
edition = "2021"

[lib]
name = "ytdlp_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
