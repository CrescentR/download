name: Yuki installers
on:
  push:
    tags: ['yuki-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri -> target
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf liblzma-dev
      - run: npm ci
        working-directory: gui
      - name: Verify release metadata
        run: node scripts/check-release.mjs
        working-directory: gui
      - name: Build installer (tools are downloaded by the application)
        run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
        working-directory: gui
        env:
          NO_STRIP: 'true'
          CARGO_BUILD_JOBS: '2'
      - uses: actions/upload-artifact@v4
        with:
          name: Yuki-${{ matrix.target }}
          path: |
            gui/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            gui/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            gui/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            gui/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
